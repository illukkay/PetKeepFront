<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetKeep - Cadastro</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f0f4f1;
            color: #2d3732;
            padding: 30px 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Contêiner das Patas Flutuantes */
        .bg-paws {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            pointer-events: none;
        }

        .paw {
            position: absolute;
            bottom: -120px;
            /* SVG de Patinha */
            background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="%231b4332"><path d="M32 38c-4.4 0-8-5.4-8-12s3.6-12 8-12 8 5.4 8 12-3.6 12-8 12zm36 0c-4.4 0-8-5.4-8-12s3.6-12 8-12 8 5.4 8 12-3.6 12-8 12zm-50 18c-4.4 0-8-5.4-8-12s3.6-12 8-12 8 5.4 8 12-3.6 12-8 12zm64 0c-4.4 0-8-5.4-8-12s3.6-12 8-12 8 5.4 8 12-3.6 12-8 12zm-32 2c-15.5 0-28 10-28 22 0 7 10 16 28 16s28-9 28-16c0-12-12.5-22-28-22z"/></svg>');
            background-size: contain;
            background-repeat: no-repeat;
            opacity: 0.12;
            animation: floatPaw 15s infinite linear;
        }

        /* Variações de Posição */
        .paw:nth-child(1) { left: 5%;  width: 70px; height: 70px; animation-duration: 13s; animation-delay: 0s; }
        .paw:nth-child(2) { left: 20%; width: 95px; height: 95px; animation-duration: 18s; animation-delay: 3s; }
        .paw:nth-child(3) { left: 37%; width: 60px; height: 60px; animation-duration: 12s; animation-delay: 1s; }
        .paw:nth-child(4) { left: 56%; width: 85px; height: 85px; animation-duration: 16s; animation-delay: 5s; }
        .paw:nth-child(5) { left: 73%; width: 68px; height: 68px; animation-duration: 14s; animation-delay: 2s; }
        .paw:nth-child(6) { left: 88%; width: 90px; height: 90px; animation-duration: 19s; animation-delay: 4s; }

        @keyframes floatPaw {
            0% {
                transform: translateY(0) rotate(-15deg);
                opacity: 0;
            }
            10% { opacity: 0.12; }
            90% { opacity: 0.12; }
            100% {
                transform: translateY(-115vh) rotate(35deg);
                opacity: 0;
            }
        }

        .container {
            width: 100%;
            max-width: 960px;
            display: flex;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid #cbd5e1;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            position: relative;
            z-index: 2;
        }

        /* Painel Esquerdo Destaque */
        .left-banner {
            width: 32%;
            background: #1b4332;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 30px;
        }

        .left-banner h1 {
            font-size: 32px;
            letter-spacing: -0.5px;
        }

        .left-banner p {
            font-size: 14px;
            line-height: 1.6;
            color: #e2e8f0;
        }

        .left-banner .brand-footer {
            font-size: 13px;
            color: #a3b18a;
        }

        /* Painel Direito Formulário */
        .right-content {
            width: 68%;
            padding: 40px 45px;
        }

        .right-content h2 {
            font-size: 26px;
            color: #1b4332;
            margin-bottom: 6px;
        }

        .subtitle {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }

        /* Divisão por Seções */
        .form-section-title {
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #1b4332;
            margin: 20px 0 12px 0;
            padding-bottom: 4px;
            border-bottom: 2px solid #e2e8f0;
        }

        .form-section-title:first-of-type {
            margin-top: 0;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
        }

        .col-6 { grid-column: span 6; }
        .col-4 { grid-column: span 4; }
        .col-3 { grid-column: span 3; }
        .col-2 { grid-column: span 2; }

        .campo {
            display: flex;
            flex-direction: column;
        }

        .campo label {
            margin-bottom: 6px;
            color: #2d3732;
            font-size: 13px;
            font-weight: bold;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 11px 13px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            color: #2d3732;
            background-color: #fafafa;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .campo input:focus,
        .campo select:focus {
            border-color: #1b4332;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(27, 67, 50, 0.1);
        }

        .erro {
            background: #fde8e8;
            color: #9b1c1c;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #f8b4b4;
            text-align: center;
        }

        .botoes {
            grid-column: span 6;
            margin-top: 20px;
        }

        .botao {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #1b4332;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .botao:hover {
            background: #2d6a4f;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 18px;
            color: #64748b;
            font-size: 14px;
            text-decoration: none;
        }

        .voltar a {
            color: #1b4332;
            font-weight: bold;
            text-decoration: none;
        }

        .voltar a:hover {
            text-decoration: underline;
        }

        /* Ajuste Responsivo */
        @media (max-width: 820px) {
            .left-banner {
                display: none;
            }

            .right-content {
                width: 100%;
                padding: 35px 25px;
            }
        }

        @media (max-width: 580px) {
            .col-4, .col-3, .col-2 {
                grid-column: span 6;
            }
        }
    </style>
</head>

<body>

<!-- Animação de Patinhas no Fundo -->
<div class="bg-paws">
    <div class="paw"></div>
    <div class="paw"></div>
    <div class="paw"></div>
    <div class="paw"></div>
    <div class="paw"></div>
    <div class="paw"></div>
</div>

<div class="container">

    <!-- Lateral Institucional -->
    <div class="left-banner">
        <div>
            <h1>PetKeep</h1>
            <p style="margin-top: 16px;">
                Crie sua conta para gerenciar consultas, vacinas e cuidados do seu pet em um único lugar.
            </p>
        </div>
        <div class="brand-footer">
            PetKeep &copy; Todos os direitos reservados.
        </div>
    </div>

    <!-- Formulário Principal -->
    <div class="right-content">

        <h2>Criar conta</h2>
        <p class="subtitle">Preencha seus dados para começar a usar a plataforma.</p>

        <div class="erro" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/cadastro}" th:object="${user}" method="post">

            <!-- Seção 1: Dados Pessoais -->
            <div class="form-section-title">Dados Pessoais</div>

            <div class="grid-form">
                <div class="campo col-6">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" th:field="*{nome}" placeholder="Seu nome" required>
                </div>

                <div class="campo col-3">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" placeholder="seu@email.com" required>
                </div>

                <div class="campo col-3">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" th:field="*{senha}" placeholder="Sua senha" required>
                </div>

                <div class="campo col-6">
                    <label for="telefone">Telefone / WhatsApp</label>
                    <input type="text" id="telefone" th:field="*{telefone}" placeholder="Somente números, ex: 11912345678" pattern="\d+" inputmode="numeric" required>
                </div>
            </div>

            <!-- Seção 2: Endereço -->
            <div class="form-section-title">Endereço</div>

            <div class="grid-form">
                <div class="campo col-4">
                    <label for="rua">Rua / Logradouro</label>
                    <input type="text" id="rua" th:field="*{rua}" placeholder="Nome da rua" required>
                </div>

                <div class="campo col-2">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" th:field="*{bairro}" placeholder="Seu bairro" required>
                </div>

                <div class="campo col-4">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" th:field="*{cidade}" placeholder="Sua cidade" required>
                </div>

                <div class="campo col-2">
                    <label for="estado">Estado (UF)</label>
                    <input type="text" id="estado" th:field="*{estado}" maxlength="2" placeholder="UF" required>
                </div>
            </div>

            <!-- Seção 3: Preferências -->
            <div class="form-section-title">Perfil</div>

            <div class="grid-form">
                <div class="campo col-3">
                    <label for="tipoResidencia">Tipo de Residência</label>
                    <select id="tipoResidencia" th:field="*{tipoResidencia}" required>
                        <option value="">Selecione</option>
                        <option th:each="tipo : ${T(com.petkeep.front.model.Usuario.TipoResidencia).values()}"
                                th:value="${tipo}"
                                th:text="${tipo}">
                        </option>
                    </select>
                </div>

                <div class="campo col-3">
                    <label for="tipoUsuario">Tipo de Usuário</label>
                    <select id="tipoUsuario" th:field="*{tipoUsuario}" required>
                        <option value="">Selecione</option>
                        <option th:each="tipo : ${T(com.petkeep.front.model.Usuario.TipoUsuario).values()}"
                                th:value="${tipo}"
                                th:text="${tipo}">
                        </option>
                    </select>
                </div>

                <div class="botoes">
                    <button type="submit" class="botao">Criar minha conta</button>
                </div>
            </div>

        </form>

        <div class="voltar">
            Já possui uma conta? <a href="/logar">Fazer login</a>
        </div>

    </div>

</div>

</body>
</html>
