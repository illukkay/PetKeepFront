<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - PetKeep</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f4f1;
            color: #2d3732;
            min-height: 100vh;
        }

        header {
            background-color: #1b4332;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0d281e;
        }

        header h1 {
            font-size: 26px;
        }

        main {
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .card {
            background-color: white;
            padding: 35px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .card h2 {
            font-size: 28px;
            margin-bottom: 25px;
            color: #1b4332;
            text-align: center;
        }

        .grid-form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .campo {
            margin-bottom: 5px;
        }

        .campo-full {
            grid-column: span 2;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2d3732;
        }

        .campo input,
        .campo select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 15px;
            outline: none;
            color: #2d3732;
            background-color: #fff;
        }

        .campo input:focus,
        .campo select:focus {
            border-color: #1b4332;
        }

        .erro {
            background-color: #fde8e8;
            color: #9b1c1c;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #f8b4b4;
            font-size: 14px;
        }

        .botoes {
            grid-column: span 2;
            margin-top: 15px;
        }

        .botao {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background-color: #1b4332;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .botao:hover {
            background-color: #2d6a4f;
        }

        .voltar {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #1b4332;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            .card {
                padding: 25px;
            }

            .grid-form {
                grid-template-columns: 1fr;
            }

            .campo-full {
                grid-column: span 1;
            }

            .botoes {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>PetKeep</h1>
</header>

<main>

    <div class="card">

        <h2>Criar conta</h2>

        <div class="erro" th:if="${errorMessage}" th:text="${errorMessage}"></div>

        <form th:action="@{/cadastro}" th:object="${user}" method="post">

            <div class="grid-form">

                <div class="campo campo-full">
                    <label for="nome">Nome</label>
                    <input type="text" id="nome" th:field="*{nome}" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" th:field="*{email}" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" th:field="*{senha}" required>
                </div>

                <div class="campo campo-full">
                    <label for="telefone">Telefone</label>
                    <input type="text" id="telefone" th:field="*{telefone}" required>
                </div>

                <div class="campo campo-full">
                    <label for="rua">Rua</label>
                    <input type="text" id="rua" th:field="*{rua}" required>
                </div>

                <div class="campo">
                    <label for="bairro">Bairro</label>
                    <input type="text" id="bairro" th:field="*{bairro}" required>
                </div>

                <div class="campo">
                    <label for="cidade">Cidade</label>
                    <input type="text" id="cidade" th:field="*{cidade}" required>
                </div>

                <div class="campo">
                    <label for="estado">Estado</label>
                    <input type="text" id="estado" th:field="*{estado}" maxlength="2" required>
                </div>

                <div class="campo">
                    <label for="tipoResidencia">Tipo de residência</label>
                    <select id="tipoResidencia" th:field="*{tipoResidencia}" required>
                        <option value="">Selecione</option>
                        <option th:each="tipo : ${T(com.petkeep.front.model.Usuario.TipoResidencia).values()}"
                                th:value="${tipo}"
                                th:text="${tipo}">
                        </option>
                    </select>
                </div>

                <div class="campo campo-full">
                    <label for="tipoUsuario">Tipo de usuário</label>
                    <select id="tipoUsuario" th:field="*{tipoUsuario}" required>
                        <option value="">Selecione</option>
                        <option th:each="tipo : ${T(com.petkeep.front.model.Usuario.TipoUsuario).values()}"
                                th:value="${tipo}"
                                th:text="${tipo}">
                        </option>
                    </select>
                </div>

                <div class="botoes">
                    <button type="submit" class="botao">
                        Criar conta
                    </button>
                </div>

            </div>

        </form>

        <a href="/logar" class="voltar">
            Já tenho uma conta
        </a>

    </div>

</main>

</body>
</html>
