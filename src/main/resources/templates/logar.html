<!DOCTYPE html>

<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetKeep - Login</title>


<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Arial, sans-serif;
    }

    body {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f4f0ff;
    }

    .container {
        width: 900px;
        min-height: 550px;
        display: flex;
        background: white;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
    }

    .left {
        width: 45%;
        background: #7c4dff;
        color: white;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 50px;
    }

    .left h1 {
        font-size: 42px;
        margin-bottom: 15px;
    }

    .left p {
        font-size: 17px;
        line-height: 1.6;
    }

    .right {
        width: 55%;
        padding: 55px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .right h2 {
        font-size: 30px;
        color: #333;
        margin-bottom: 10px;
    }

    .subtitle {
        color: #777;
        margin-bottom: 30px;
    }

    .form-group {
        margin-bottom: 20px;
    }

    .form-group label {
        display: block;
        margin-bottom: 7px;
        color: #444;
        font-weight: bold;
    }

    .form-group input {
        width: 100%;
        padding: 13px;
        border: 1px solid #ddd;
        border-radius: 8px;
        font-size: 15px;
        outline: none;
    }

    .form-group input:focus {
        border-color: #7c4dff;
    }

    .button {
        width: 100%;
        padding: 14px;
        border: none;
        border-radius: 8px;
        background: #7c4dff;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    .button:hover {
        background: #6938e8;
    }

    .error {
        background: #ffe5e5;
        color: #c62828;
        padding: 12px;
        border-radius: 8px;
        margin-bottom: 20px;
        font-size: 14px;
    }

    .register {
        margin-top: 25px;
        text-align: center;
        color: #777;
        font-size: 14px;
    }

    .register a {
        color: #7c4dff;
        text-decoration: none;
        font-weight: bold;
    }

    @media (max-width: 700px) {
        .container {
            width: 95%;
            min-height: auto;
        }

        .left {
            display: none;
        }

        .right {
            width: 100%;
            padding: 35px;
        }
    }
</style>


</head>

<body>

<div class="container">


<div class="left">
    <h1>PetKeep</h1>
    <p>
        Cuide de quem faz parte da sua família.
        Encontre serviços e pessoas para cuidar do seu pet.
    </p>
</div>

<div class="right">

    <h2>Bem-vindo de volta!</h2>

    <p class="subtitle">
        Entre na sua conta para continuar.
    </p>

    <div
        class="error"
        th:if="${errorMessage}"
        th:text="${errorMessage}">
    </div>

    <form th:action="@{/logar}" th:object="${user}" method="post">

        <div class="form-group">
            <label for="email">E-mail</label>

            <input
                type="email"
                id="email"
                th:field="*{email}"
                placeholder="Digite seu e-mail"
                required>
        </div>

        <div class="form-group">
            <label for="senha">Senha</label>

            <input
                type="password"
                id="senha"
                th:field="*{senha}"
                placeholder="Digite sua senha"
                required>
        </div>

        <button
            type="submit"
            class="button">
            Entrar
        </button>

    </form>

    <div class="register">
        Ainda não possui uma conta?
        <a href="/registro">Cadastre-se</a>
    </div>

</div>


</div>

</body>
</html>
