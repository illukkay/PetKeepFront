<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Detalhes do Pet - PetKeep</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #f0f4f1;
            color: #2d3732;
            min-height: 100vh;
        }

        header {
            background-color: #1b4332;
            color: white;
            padding: 20px 50px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #0d281e;
        }

        header h1 {
            font-size: 26px;
        }

        .voltar-header {
            color: white;
            text-decoration: none;
            font-size: 15px;
        }

        .voltar-header:hover {
            text-decoration: underline;
        }

        main {
            max-width: 650px;
            margin: 30px auto;
            padding: 0 20px;
        }

        .card {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
        }

        .header-card {
            border-bottom: 2px solid #f0f4f1;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .header-card h2 {
            font-size: 26px;
            color: #1b4332;
        }

        /* Grade para organizar as informações sem espaço sobrando */
        .grid-info {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 20px;
        }

        .informacao {
            background-color: #f8faf9;
            padding: 12px 16px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
        }

        .informacao-full {
            grid-column: span 2;
        }

        .informacao label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 4px;
        }

        .informacao span {
            font-size: 16px;
            color: #2d3732;
            font-weight: 600;
        }

        .botoes {
            display: flex;
            gap: 12px;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #e2e8f0;
        }

        .btn {
            flex: 1;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

        .btn-voltar {
            background-color: #e2e8f0;
            color: #475569;
        }

        .btn-voltar:hover {
            background-color: #cbd5e1;
        }

        @media (max-width: 600px) {
            header {
                padding: 20px;
            }

            .grid-info {
                grid-template-columns: 1fr;
            }

            .informacao-full {
                grid-column: span 1;
            }
        }
    </style>
</head>

<body>

    <header>
        <h1>PetKeep</h1>
        <a href="/pets" class="voltar-header">Voltar para meus pets</a>
    </header>

    <main>
        <div class="card">
            
            <div class="header-card">
                <h2 th:text="${pet.nome}">Nome do Pet</h2>
            </div>

            <div class="grid-info">
                
                <div class="informacao">
                    <label>Espécie</label>
                    <span th:text="${pet.especie}">Espécie</span>
                </div>

                <div class="informacao">
                    <label>Raça</label>
                    <span th:text="${pet.raca}">Raça</span>
                </div>

                <div class="informacao">
                    <label>Idade</label>
                    <span th:text="${pet.idade + ' anos'}">Idade</span>
                </div>

                <div class="informacao">
                    <label>Porte</label>
                    <span th:text="${pet.porte}">Porte</span>
                </div>

                <div class="informacao informacao-full">
                    <label>Observações</label>
                    <span th:text="${pet.observacoes}">Nenhuma observação.</span>
                </div>

            </div>

            <div class="botoes">
                <a href="/pets" class="btn btn-voltar">
                    Voltar
                </a>
            </div>

        </div>
    </main>

</body>

</html>
